apiVersion: v1
kind: Namespace
metadata:
  name: jenkins-app
---
apiVersion: v1
kind: Secret
metadata:
  name: discord-webhook
  namespace: jenkins-app
type: Opaque
stringData:
  # This placeholder will be replaced by Jenkins with the actual secret
  # DO NOT put real secrets here - they are managed by Jenkins
  DISCORD_WEBHOOK_URL: "PLACEHOLDER_MANAGED_BY_JENKINS"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-discord-app
  namespace: jenkins-app
  labels:
    app: jenkins-discord-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins-discord-app
  template:
    metadata:
      labels:
        app: jenkins-discord-app
    spec:
      containers:
      - name: app
        image: jenkins-discord-app:BUILD_NUMBER
        imagePullPolicy: Never
        env:
        - name: DISCORD_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: discord-webhook
              key: DISCORD_WEBHOOK_URL
        - name: ENVIRONMENT
          value: "Kubernetes Cluster"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-discord-app-service
  namespace: jenkins-app
spec:
  selector:
    app: jenkins-discord-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
